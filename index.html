<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AmorVista Studios</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              beige: {
                DEFAULT: '#F1ECE6',
                dark: '#E5DED5',
              },
              black: '#000000',
              grey: {
                subtle: '#888888',
              }
            },
            fontFamily: {
              serif: ['"Playfair Display"', 'serif'],
              sans: ['"Inter"', 'sans-serif'],
            },
            animation: {
              scroll: 'scroll 100s linear infinite',
            },
            keyframes: {
              scroll: {
                '0%': { transform: 'translateX(0)' },
                '100%': { transform: 'translateX(-100%)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #F1ECE6;
        color: #000000;
        overflow-x: hidden;
      }
      /* Hide scrollbar for clean look but allow functionality */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #F1ECE6; 
      }
      ::-webkit-scrollbar-thumb {
        background: #CCCCCC; 
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #000000; 
      }
    </style>

    "framer-motion": "https://esm.sh/framer-motion@^12.34.0",
    "gsap": "https://esm.sh/gsap@^3.14.2"
  }
}
</script>
